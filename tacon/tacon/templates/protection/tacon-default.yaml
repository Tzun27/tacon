# tacon-default branch protection rule
#
# Sensible baseline for a TA-managed classroom: require one PR review
# before merge, dismiss stale reviews on new commits, no required status
# checks (so repos without CI still pass), and admins are not bound by
# the rule (so the TA can land emergency fixes).
#
# Use via:
#   tacon run add-branch-protection --rule-template tacon-default --apply --yes

required_approving_review_count: 1
dismiss_stale_reviews: true
require_code_owner_reviews: false
required_status_checks: null
strict_status_checks: false
enforce_admins: false
allow_force_pushes: false
allow_deletions: false
required_linear_history: false
