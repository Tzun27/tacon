[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tacon"
version = "0.0.1"
description = "TA console: a workbench for GitHub Classroom batch ops + class-health dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "tzun" }]
keywords = ["github", "classroom", "education", "ta", "teaching", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "PyGithub >= 2.1",
    "typer >= 0.12",
    "rich >= 13.7",
    "sqlite-utils >= 3.36",
    "jinja2 >= 3.1",
    "PyYAML >= 6.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-cov >= 5.0",
    "responses >= 0.25",
    "ruff >= 0.5",
    "mypy >= 1.10",
    "types-requests",
    "types-PyYAML",
]
tui = [
    "textual >= 0.70",
]

[project.scripts]
tacon = "tacon.cli:app"

[project.urls]
Homepage = "https://github.com/tzun/tacon"
Issues = "https://github.com/tzun/tacon/issues"

[tool.hatch.build.targets.wheel]
packages = ["tacon"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["github.*", "sqlite_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# v0.1: 90% gate (we sit at ~95%). v1.0 target: 95%.
# History: started at 70% for the v0.0.1 foundation, bumped to 90% once CLI
# orchestration + github_client edge paths got integration coverage.
addopts = "-ra --strict-markers --cov=tacon --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["tacon"]
omit = ["tacon/tui/*"]  # TUI not yet implemented; dashboard now ships
