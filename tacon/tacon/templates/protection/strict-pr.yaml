# strict-pr branch protection rule
#
# Tight rule for high-stakes assignments: two PR reviews required,
# stale reviews dismissed on new commits, admins also bound by the rule,
# linear history required (no merge commits — only fast-forward / rebase /
# squash). Use this template when you want to be sure no surprise commits
# land on `main` outside of an approved PR.
#
# Use via:
#   tacon run add-branch-protection --rule-template strict-pr --apply --yes

required_approving_review_count: 2
dismiss_stale_reviews: true
require_code_owner_reviews: false
required_status_checks: null
strict_status_checks: false
enforce_admins: true
allow_force_pushes: false
allow_deletions: false
required_linear_history: true
